<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151d35"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#273b80"/>
      <stop offset="1" stop-color="#3d5ab2"/>
    </linearGradient>
    <linearGradient id="cache" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174f58"/>
      <stop offset="1" stop-color="#1d777b"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70411a"/>
      <stop offset="1" stop-color="#ad6a23"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#9fb5e8"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#e7b76b"/>
    </marker>
    <style>
      .title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#f2f6ff}
      .subtitle{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#a9b8d8}
      .label{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#f8fbff}
      .body{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#dbe5fb}
      .small{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#b8c8e9}
      .mono{font:400 12px Consolas,monospace;fill:#e8eefc}
      .line{stroke:#9fb5e8;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .goldline{stroke:#e7b76b;stroke-width:2.2;fill:none;marker-end:url(#arrowGold)}
      .dashed{stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1400" height="920" fill="url(#bg)"/>
  <text x="60" y="58" class="title">Context Intelligence Model · 算子设计图</text>
  <text x="60" y="84" class="subtitle">单模型多任务：语义编码 → 任务路由 → 结构化解码 → Runtime 确定性校验</text>

  <!-- Input -->
  <g filter="url(#shadow)">
    <rect x="50" y="150" width="240" height="470" rx="18" fill="#202b4a" stroke="#5e76b7" stroke-width="1.5"/>
    <text x="76" y="190" class="label">输入与来源</text>
    <rect x="75" y="220" width="190" height="62" rx="10" fill="#2f3c64"/>
    <text x="90" y="247" class="body">消息 / 工具结果</text><text x="90" y="268" class="small">observation · failure · event</text>
    <rect x="75" y="298" width="190" height="62" rx="10" fill="#2f3c64"/>
    <text x="90" y="325" class="body">ContextDocument</text><text x="90" y="346" class="small">active entries · candidates</text>
    <rect x="75" y="376" width="190" height="62" rx="10" fill="#2f3c64"/>
    <text x="90" y="403" class="body">长期记忆</text><text x="90" y="424" class="small">archive · recall candidates</text>
    <rect x="75" y="454" width="190" height="115" rx="10" fill="#18213b" stroke="#8097d3"/>
    <text x="90" y="481" class="body">结构化输入块</text>
    <text x="90" y="507" class="mono">&lt;task&gt;</text>
    <text x="90" y="527" class="mono">&lt;entry id type&gt;</text>
    <text x="90" y="547" class="mono">&lt;evidence ref&gt;</text>
  </g>

  <!-- Encoder -->
  <g filter="url(#shadow)">
    <rect x="350" y="130" width="330" height="510" rx="18" fill="url(#model)" stroke="#8aa5ff" stroke-width="1.5"/>
    <text x="378" y="171" class="label">共享编码层 · Shared Backbone</text>
    <text x="378" y="195" class="small">decoder-only Transformer / LoRA</text>
    <rect x="378" y="225" width="274" height="75" rx="10" fill="#1d2b5f"/>
    <text x="395" y="252" class="body">Token Embedding</text><text x="395" y="274" class="small">中文、Markdown、JSON、特殊标记</text>
    <rect x="378" y="320" width="274" height="90" rx="10" fill="#1d2b5f"/>
    <text x="395" y="347" class="body">Entry / Evidence 表示</text><text x="395" y="369" class="small">局部语义块、来源、时间、hash</text><text x="395" y="391" class="small">实体和事件关系的隐式表示</text>
    <rect x="378" y="430" width="274" height="88" rx="10" fill="#1d2b5f"/>
    <text x="395" y="457" class="body">Document 表示</text><text x="395" y="479" class="small">section、entry 顺序、任务约束</text><text x="395" y="501" class="small">局部上下文 + 召回片段</text>
    <rect x="378" y="538" width="274" height="72" rx="10" fill="#1d2b5f"/>
    <text x="395" y="566" class="body">KV Cache 前缀</text><text x="395" y="588" class="small">constitution + tools + stable document prefix</text>
  </g>

  <!-- Cache -->
  <g filter="url(#shadow)">
    <rect x="740" y="130" width="300" height="510" rx="18" fill="url(#cache)" stroke="#66d1cd" stroke-width="1.5"/>
    <text x="768" y="171" class="label">上下文语义缓存</text>
    <text x="768" y="195" class="small">外部持久状态，不等同于 KV Cache</text>
    <rect x="768" y="225" width="244" height="70" rx="10" fill="#14525c"/>
    <text x="785" y="252" class="body">L0 当前任务</text><text x="785" y="274" class="small">目标、约束、最近消息</text>
    <rect x="768" y="315" width="244" height="70" rx="10" fill="#14525c"/>
    <text x="785" y="342" class="body">L1 活动信息</text><text x="785" y="364" class="small">当前 entries / candidates</text>
    <rect x="768" y="405" width="244" height="70" rx="10" fill="#14525c"/>
    <text x="785" y="432" class="body">L2 章节和实体状态</text><text x="785" y="454" class="small">summary · entity index · time index</text>
    <rect x="768" y="495" width="244" height="90" rx="10" fill="#14525c"/>
    <text x="785" y="522" class="body">L3 长期归档</text><text x="785" y="544" class="small">原文、摘要、evidence、embedding</text><text x="785" y="566" class="small">可召回，不直接成为当前事实</text>
  </g>

  <!-- Tasks -->
  <g filter="url(#shadow)">
    <rect x="1095" y="130" width="255" height="510" rx="18" fill="#2b3153" stroke="#9c9ddd" stroke-width="1.5"/>
    <text x="1122" y="171" class="label">单模型任务路由</text>
    <text x="1122" y="195" class="small">task token + task schema</text>
    <g fill="#414777">
      <rect x="1122" y="225" width="200" height="40" rx="8"/><rect x="1122" y="275" width="200" height="40" rx="8"/><rect x="1122" y="325" width="200" height="40" rx="8"/><rect x="1122" y="375" width="200" height="40" rx="8"/><rect x="1122" y="425" width="200" height="40" rx="8"/><rect x="1122" y="475" width="200" height="40" rx="8"/><rect x="1122" y="525" width="200" height="40" rx="8"/>
    </g>
    <text x="1140" y="251" class="body">extract</text>
    <text x="1140" y="301" class="body">align</text>
    <text x="1140" y="351" class="body">relation</text>
    <text x="1140" y="401" class="body">documentize</text>
    <text x="1140" y="451" class="body">archive</text>
    <text x="1140" y="501" class="body">recall</text>
    <text x="1140" y="551" class="body">diff</text>
  </g>

  <!-- arrows top -->
  <path d="M290 350 C315 350 325 350 350 350" class="line"/>
  <path d="M680 350 C705 350 715 350 740 350" class="line"/>
  <path d="M1040 350 C1060 350 1070 350 1095 350" class="line"/>
  <text x="300" y="334" class="small">结构化块</text>
  <text x="690" y="334" class="small">语义表示 / 召回</text>
  <text x="1048" y="334" class="small">任务表示</text>

  <!-- Decoder -->
  <g filter="url(#shadow)">
    <rect x="210" y="700" width="470" height="150" rx="18" fill="url(#model)" stroke="#8aa5ff" stroke-width="1.5"/>
    <text x="238" y="737" class="label">结构化解码层</text>
    <text x="238" y="765" class="body">Grammar / JSON Schema / token mask</text>
    <text x="238" y="790" class="small">有限操作集合 · 合法 ID 复制 · 字段长度约束</text>
    <text x="238" y="814" class="mono">DiffProposal | ArchiveProposal | RecallProposal</text>
  </g>

  <!-- Runtime gate -->
  <g filter="url(#shadow)">
    <rect x="760" y="700" width="420" height="150" rx="18" fill="url(#gate)" stroke="#edbd6a" stroke-width="1.5"/>
    <text x="788" y="737" class="label">Runtime 确定性校验</text>
    <text x="788" y="765" class="body">revision · hash · evidence · permission</text>
    <text x="788" y="790" class="small">conflict · idempotency · reversible archive</text>
    <text x="788" y="814" class="mono">accept | reject | conflict | request_review</text>
  </g>

  <path d="M1220 640 C1040 665 900 675 680 720" class="goldline"/>
  <path d="M680 775 C710 775 730 775 760 775" class="goldline"/>
  <path d="M970 700 C970 665 970 640 970 600" class="goldline dashed"/>
  <text x="1080" y="670" class="small">任务输出</text>
  <text x="694" y="758" class="small">候选操作</text>
  <text x="985" y="666" class="small">状态回写 / 新版本</text>

  <!-- Legend -->
  <rect x="50" y="875" width="1300" height="1" fill="#38476d"/>
  <circle cx="70" cy="900" r="7" fill="#3d5ab2"/><text x="86" y="905" class="small">模型计算</text>
  <circle cx="190" cy="900" r="7" fill="#1d777b"/><text x="206" y="905" class="small">语义缓存</text>
  <circle cx="310" cy="900" r="7" fill="#ad6a23"/><text x="326" y="905" class="small">系统门禁</text>
  <text x="1110" y="905" class="small">设计版本：context-intelligence-v1</text>
</svg>
